name: 数据源诊断（不调用AI）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线诊断输出测试
        run: python -m unittest discover -s tests -p test_report_data_diagnostic.py -v
      - name: 交易所公开接口日期与单位核验
        env:
          TZ: Asia/Shanghai
        run: |
          python - <<'PY'
          """Inspect public exchange payload dates/units, without model or notification clients."""
          import io
          import json
          import logging
          import os
          from pathlib import Path
          
          import pandas as pd
          import requests
          
          logging.disable(logging.CRITICAL)
          
          from src.core.trading_calendar import build_market_phase_context
          
          
          def main():
              clock = build_market_phase_context(market="cn")
              trade_date = clock.effective_daily_bar_date.isoformat()
              result = {
                  "expected_date": trade_date,
                  "calendar_warnings": list(clock.warnings),
                  "model_called": False,
                  "notification_sent": False,
              }
              root = Path("reports/data_diagnostics")
              root.mkdir(parents=True, exist_ok=True)
              sources = (
                  ("sse", "https://query.sse.com.cn/commonQuery.do", {
                      "sqlId": "COMMON_SSE_SJ_GPSJ_CJGK_MRGK_C",
                      "PRODUCT_CODE": "01,02,03,11,17",
                      "type": "inParams", "SEARCH_DATE": trade_date,
                  }),
                  ("szse", "https://www.szse.cn/api/report/ShowReport", {
                      "SHOWTYPE": "xlsx", "CATALOGID": "1803_sczm",
                      "TABKEY": "tab1", "txtQueryDate": trade_date,
                  }),
              )
              for name, url, params in sources:
                  try:
                      referer = "https://www.sse.com.cn/" if name == "sse" else "https://www.szse.cn/"
                      response = requests.get(
                          url, params=params,
                          headers={"Referer": referer, "User-Agent": "Mozilla/5.0"},
                          timeout=(5, 12),
                      )
                      response.raise_for_status()
                      if len(response.content) > 2_000_000:
                          raise ValueError("response exceeds diagnostic size limit")
                      if name == "sse":
                          payload = response.json()
                          public_rows = payload.get("result") if isinstance(payload, dict) else None
                          result[name] = {"status": "received", "public_result": public_rows}
                          (root / "exchange_sse_raw.json").write_text(
                              json.dumps(public_rows, ensure_ascii=False, indent=2), encoding="utf-8"
                          )
                      else:
                          frame = pd.read_excel(io.BytesIO(response.content), header=None, engine="openpyxl")
                          result[name] = {
                              "status": "received",
                              "rows": frame.head(20).fillna("").astype(str).values.tolist(),
                          }
                          (root / "exchange_szse_raw.xlsx").write_bytes(response.content)
                  except Exception as exc:
                      # Do not print raw errors, arbitrary URLs, credentials or response bodies.
                      result[name] = {"status": "unavailable", "error_type": type(exc).__name__}
              text = json.dumps(result, ensure_ascii=False, indent=2, default=str)
              (root / "exchange_access.json").write_text(text, encoding="utf-8")
              summary = "# 交易所公开数据核验（无AI）\n\n```json\n" + text + "\n```\n"
              (root / "exchange_access.md").write_text(summary, encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(summary)
              print(text)
          
          
          if __name__ == "__main__":
              main()
          PY
      # Read-only access probe reuses the production Tushare client. No AI/notification secrets.
      - name: Tushare 官方接口权限检查
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_HTTP_URL: https://api.tushare.pro
        run: |
          python - <<'PY'
          import json, logging, os, time
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          logging.disable(logging.CRITICAL)
          from data_provider.tushare_fetcher import TushareFetcher
          out = {"model_called": False, "notification_sent": False, "token_configured": bool(os.getenv("TUSHARE_TOKEN")), "interfaces": {}}
          fetcher = TushareFetcher()
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          def probe(name, **params):
              try:
                  frame = fetcher._call_api_with_rate_limit(name, **params)
                  item = {"status": "ok" if len(frame) else "empty", "rows": len(frame)}
                  for key in ("trade_date", "end_date", "ann_date"):
                      if key in frame and len(frame):
                          item["latest_" + key] = str(frame[key].max())
                  out["interfaces"][name] = item
                  return frame
              except Exception as exc:
                  text = str(exc).lower()
                  category = "other_failure"
                  for label, words in (("rate_limited", ("每分钟", "每天", "频次", "限流", "429")), ("permission_denied", ("权限", "没有访问", "permission", "forbidden")), ("invalid_token", ("token", "令牌")), ("network_failure", ("connection", "timeout", "timed out", "proxy", "http"))):
                      if any(word in text for word in words):
                          category = label
                          break
                  out["interfaces"][name] = {"status": category}
                  return None
              finally:
                  time.sleep(15)
          cal = probe("trade_cal", exchange="SSE", start_date=(now-timedelta(days=30)).strftime("%Y%m%d"), end_date=now.strftime("%Y%m%d"))
          if cal is not None and not cal.empty:
              opened = cal.loc[cal.is_open.eq(1), "cal_date"]
              latest = str(opened.max()) if len(opened) else None
          else:
              latest = None
          out["latest_open_date"] = latest
          if latest:
              probe("daily", trade_date=latest)
              probe("index_daily", ts_code="000001.SH", trade_date=latest)
              probe("daily_basic", ts_code="600519.SH", trade_date=latest)
              probe("income", ts_code="600519.SH", start_date=(now-timedelta(days=365)).strftime("%Y%m%d"), end_date=now.strftime("%Y%m%d"))
              probe("cashflow", ts_code="600519.SH", start_date=(now-timedelta(days=365)).strftime("%Y%m%d"), end_date=now.strftime("%Y%m%d"))
              probe("fina_indicator", ts_code="600519.SH", start_date=(now-timedelta(days=365)).strftime("%Y%m%d"), end_date=now.strftime("%Y%m%d"))
              probe("moneyflow", ts_code="600519.SH", trade_date=latest)
          else:
              out["remaining_checks"] = "skipped_without_verified_trade_calendar"
          target = Path("reports/data_diagnostics")
          target.mkdir(parents=True, exist_ok=True)
          text = json.dumps(out, ensure_ascii=False, indent=2)
          (target / "tushare_access.json").write_text(text, encoding="utf-8")
          summary = "# Tushare 接口权限检查（无AI、无通知）\n\n官方接口返回验证；仅输出状态、记录数和日期，不输出 Token 或原始异常。\n\n```json\n" + text + "\n```\n"
          (target / "tushare_access.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(text)
          PY
      - name: 只检查数据（无模型和通知密钥）
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_HTTP_URL: https://api.tushare.pro
          FUNDAMENTAL_STAGE_TIMEOUT_SECONDS: ${{ vars.FUNDAMENTAL_STAGE_TIMEOUT_SECONDS || '8.0' }}
          FUNDAMENTAL_FETCH_TIMEOUT_SECONDS: ${{ vars.FUNDAMENTAL_FETCH_TIMEOUT_SECONDS || '8.0' }}
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
        run: python scripts/diagnose_report_data.py
      - name: 显示诊断结果
        if: always()
        run: |
          if [ -f reports/data_diagnostics/diagnostic.md ]; then
            cat reports/data_diagnostics/diagnostic.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保存诊断结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-diagnostic-${{ github.run_number }}
          path: reports/data_diagnostics/
          retention-days: 7
          if-no-files-found: warn

name: 每日自动选股与AI分析（最多3只）

on:
  # 北京时间周一至周五 17:17；交易日历另行跳过节假日。
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:
    inputs:
      daily_limit:
        description: 每策略日线核验上限（不是逐股全量扫描）
        type: choice
        default: '100'
        options:
          - '30'
          - '100'
          - '300'
      send_notification:
        description: 本次发送结果到现有 PushPlus
        type: boolean
        default: false
      run_ai:
        description: 本次调用现有模型分析最多3只（产生模型费用，占用当天AI批次）
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: screening-factor-test
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 与原每日分析工作流保持相同 Secret/Variable 作用域。
    environment: STOCK_LIST
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 离线回归检查（不请求行情或模型）
        run: |
          python -m unittest discover -s tests -p test_screen_candidates_cli.py -v
          python -m unittest discover -s tests -p test_screening_pushplus.py -v
          python -m unittest discover -s tests -p test_screening_ai.py -v
      - name: 执行两套因子选股策略
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          DAILY_LIMIT: ${{ inputs.daily_limit || '100' }}
          EVENT_NAME: ${{ github.event_name }}
          SCREENING_SNAPSHOT_CALL_TIMEOUT_SEC: '60'
          SCREENING_DAILY_CALL_TIMEOUT_SEC: '15'
        run: |
          args=(--daily-limit "$DAILY_LIMIT")
          if [ "$EVENT_NAME" = "schedule" ]; then args+=(--scheduled); fi
          python scripts/screen_candidates.py "${args[@]}"
      - name: 检查候选与当天AI批次
        id: ai_plan
        if: success() && (github.event_name == 'schedule' || inputs.run_ai == true)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(prepare)
          if [ "$EVENT_NAME" = "schedule" ]; then args+=(--scheduled); fi
          python scripts/screening_ai.py "${args[@]}"
      - name: 先持久化当天AI额度（成功后才允许调用模型）
        id: reserve_ai_budget
        if: success() && steps.ai_plan.outputs.analyze == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ai_plan.outputs.budget_name }}
          path: reports/screening_test/ai_plan.json
          if-no-files-found: error
          retention-days: 30
      - name: 调用原模型分析候选（每日一批最多3只）
        if: success() && steps.ai_plan.outputs.analyze == 'true'
        env:
          FUNDAMENTAL_STAGE_TIMEOUT_SECONDS: ${{ vars.FUNDAMENTAL_STAGE_TIMEOUT_SECONDS || '8.0' }}
          FUNDAMENTAL_FETCH_TIMEOUT_SECONDS: ${{ vars.FUNDAMENTAL_FETCH_TIMEOUT_SECONDS || '8.0' }}
          GH_TOKEN: ${{ github.token }}
          RESERVATION_ID: ${{ steps.reserve_ai_budget.outputs.artifact-id }}
          AGENT_MODE: 'false'
          DAILY_MARKET_CONTEXT_ENABLED: 'false'
          MARKET_REVIEW_ENABLED: 'false'
          BACKTEST_ENABLED: 'false'
          MAX_WORKERS: '1'
          SINGLE_STOCK_NOTIFY: 'false'
          REPORT_TYPE: 'full'
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'tencent,akshare_sina,efinance,akshare_em' }}
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}
          GENERATION_BACKEND_TIMEOUT_SECONDS: ${{ vars.GENERATION_BACKEND_TIMEOUT_SECONDS || secrets.GENERATION_BACKEND_TIMEOUT_SECONDS }}
          GENERATION_BACKEND_MAX_OUTPUT_BYTES: ${{ vars.GENERATION_BACKEND_MAX_OUTPUT_BYTES || secrets.GENERATION_BACKEND_MAX_OUTPUT_BYTES }}
          GENERATION_BACKEND_MAX_CONCURRENCY: ${{ vars.GENERATION_BACKEND_MAX_CONCURRENCY || secrets.GENERATION_BACKEND_MAX_CONCURRENCY }}
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || secrets.OPENAI_VISION_MODEL }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}
